<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' music-artifact:; connect-src 'self' music-artifact:; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Studio</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar" aria-label="화면">
        <!-- 신호등 단추와 창 단추가 놓이는 줄. 이 줄만 창을 끄는 자리다. -->
        <div class="titlebar sidebar-titlebar" aria-hidden="true"></div>
        <div class="sidebar-body" id="sidebar-body"></div>
      </aside>
      <div class="resizer" id="sidebar-resizer" aria-label="사이드바 너비 (끌어서 조절, 두 번 누르면 기본 너비)"></div>
      <main class="content" id="content">
        <header class="titlebar topbar" id="topbar"></header>
        <div class="views" id="views">
          <section class="view" id="view-library" hidden></section>
          <section class="view" id="view-create" hidden></section>
          <section class="view view-studio" id="view-studio" hidden></section>
          <section class="view" id="view-settings" hidden></section>
        </div>
      </main>
      <!-- 끌기 영역보다 뒤에 둬야 클릭이 창 끌기에 먹히지 않는다. -->
      <div class="window-controls" id="window-controls" role="toolbar" aria-label="창 탐색"></div>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    <script src="./renderer.js"></script>
  </body>
</html>
